<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10과 뭐 먹을래? — Hangeul Valley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800;900&family=Noto+Sans+KR:wght@400;700;900&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/diner/diner.css" />
</head>
<body>
  <div id="skyline"></div>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">뭐 먹을래?<small>2B Unit 10 · Saturday night</small></div>
      <div class="top-actions">
        <span class="hearts" id="hearts">♥♥♥</span>
        <span class="chip">문법 <b id="sc-g">0</b></span>
        <span class="chip">어휘 <b id="sc-v">0</b></span>
        <span class="chip">말투 <b id="sc-r">0</b></span>
        <button class="ghost" id="btn-gloss" type="button">Gloss ON</button>
        <button class="ghost" id="btn-back" type="button">← Valley</button>
      </div>
    </header>
    <div class="progress" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <main class="stage" id="stage"></main>
  </div>
  <script src="/diner/diner.js"></script>
</body>
</html>
